<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .board { fill: #008184; stroke: #005f61; stroke-width: 3; rx: 12; }
      .component { fill: #1e293b; stroke: #0f172a; stroke-width: 2; rx: 8; }
      .component-light { fill: #e2e8f0; stroke: #64748b; stroke-width: 2; rx: 8; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .comp-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .comp-title-dark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .pin-label { font-family: monospace; font-size: 12px; font-weight: bold; fill: #f1f5f9; }
      .pin-label-dark { font-family: monospace; font-size: 12px; font-weight: bold; fill: #334155; }
      .wire-vcc { stroke: #ef4444; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-gnd { stroke: #1e293b; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-sig1 { stroke: #f59e0b; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-sig2 { stroke: #3b82f6; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-sig3 { stroke: #10b981; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-sig4 { stroke: #8b5cf6; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-sig5 { stroke: #ec4899; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #334155; }
    </style>
  </defs>

  
  <rect class="bg" width="900" height="540" rx="10" />

  
  <line x1="260" y1="60" x2="640" y2="60" class="wire-vcc" />
  <text x="450" y="50" class="pin-label-dark" text-anchor="middle" fill="#ef4444">Szyna +5V (VCC)</text>

  <line x1="260" y1="480" x2="640" y2="480" class="wire-gnd" />
  <text x="450" y="500" class="pin-label-dark" text-anchor="middle">Szyna GND (Masa)</text>

  
  <rect x="330" y="110" width="240" height="320" class="board" />
  <text x="450" y="150" class="title">ARDUINO UNO</text>
  <rect x="315" y="170" width="35" height="50" fill="#94a3b8" rx="3" />
  <text x="332" y="200" font-family="monospace" font-size="10" fill="#1e293b" text-anchor="middle" transform="rotate(-90 332,200)">USB</text>

  
  <circle cx="345" cy="270" r="5" fill="#ef4444" />
  <text x="358" y="274" class="pin-label">5V</text>
  <polyline points="345,270 290,270 290,60" class="wire-vcc" />

  <circle cx="345" cy="300" r="5" fill="#1e293b" />
  <text x="358" y="304" class="pin-label">GND</text>
  <polyline points="345,300 290,300 290,480" class="wire-gnd" />

  
  <circle cx="555" cy="190" r="5" fill="#ec4899" />
  <text x="542" y="194" class="pin-label" text-anchor="end">D12 (LED)</text>

  <circle cx="555" cy="230" r="5" fill="#8b5cf6" />
  <text x="542" y="234" class="pin-label" text-anchor="end">D10 (IR)</text>

  <circle cx="555" cy="290" r="5" fill="#3b82f6" />
  <text x="542" y="294" class="pin-label" text-anchor="end">D5 (Serwo 2)</text>

  <circle cx="555" cy="330" r="5" fill="#10b981" />
  <text x="542" y="334" class="pin-label" text-anchor="end">D4 (PIR)</text>

  <circle cx="555" cy="370" r="5" fill="#f59e0b" />
  <text x="542" y="374" class="pin-label" text-anchor="end">D3 (Serwo 1)</text>

  
  <rect x="40" y="90" width="160" height="95" class="component" />
  <text x="120" y="115" class="comp-title">SERWO 1 (Brama L)</text>
  <text x="185" y="135" class="pin-label" text-anchor="end">VCC</text>
  <text x="185" y="155" class="pin-label" text-anchor="end">GND</text>
  <text x="185" y="175" class="pin-label" text-anchor="end">SIG</text>
  
  <polyline points="200,131 260,131 260,60" class="wire-vcc" />
  <polyline points="200,151 245,151 245,480" class="wire-gnd" />
  <polyline points="200,171 230,171 230,450 610,450 610,370 555,370" class="wire-sig1" />

  
  <rect x="40" y="290" width="160" height="95" class="component" />
  <text x="120" y="315" class="comp-title">SERWO 2 (Brama P)</text>
  <text x="185" y="335" class="pin-label" text-anchor="end">VCC</text>
  <text x="185" y="355" class="pin-label" text-anchor="end">GND</text>
  <text x="185" y="375" class="pin-label" text-anchor="end">SIG</text>
  
  <polyline points="200,331 275,331 275,60" class="wire-vcc" />
  <polyline points="200,351 260,351 260,480" class="wire-gnd" />
  <polyline points="200,371 215,371 215,465 595,465 595,290 555,290" class="wire-sig2" />

  
  <rect x="700" y="80" width="160" height="90" class="component-light" />
  <text x="780" y="105" class="comp-title-dark">DIODA LED</text>
  <text x="715" y="130" class="pin-label-dark">Anoda (+) [220Ω]</text>
  <text x="715" y="155" class="pin-label-dark">Katoda (-)</text>
  
  <polyline points="555,190 650,190 650,126 700,126" class="wire-sig5" />
  <polyline points="700,151 670,151 670,480 640,480" class="wire-gnd" />

  
  <rect x="700" y="205" width="160" height="95" class="component" />
  <text x="780" y="230" class="comp-title">ODBIORNIK IR</text>
  <text x="715" y="250" class="pin-label">OUT (Sygnał)</text>
  <text x="715" y="270" class="pin-label">VCC (+5V)</text>
  <text x="715" y="290" class="pin-label">GND</text>
  
  <polyline points="555,230 635,230 635,246 700,246" class="wire-sig4" />
  <polyline points="700,266 640,266 640,60" class="wire-vcc" />
  <polyline points="700,286 655,286 655,480" class="wire-gnd" />

  
  <rect x="700" y="335" width="160" height="95" class="component" />
  <text x="780" y="360" class="comp-title">CZUJNIK RUCHU PIR</text>
  <text x="715" y="380" class="pin-label">VCC (+5V)</text>
  <text x="715" y="400" class="pin-label">OUT (Sygnał)</text>
  <text x="715" y="420" class="pin-label">GND</text>
  
  <polyline points="700,376 625,376 625,60" class="wire-vcc" />
  <polyline points="555,330 610,330 610,396 700,396" class="wire-sig3" />
  <polyline points="700,416 640,416 640,480" class="wire-gnd" />

  
  <rect x="20" y="495" width="230" height="35" fill="#e2e8f0" rx="5" />
  <line x1="30" y1="512" x2="55" y2="512" class="wire-vcc" />
  <text x="62" y="517" class="legend-text">+5V</text>
  <line x1="100" y1="512" x2="125" y2="512" class="wire-gnd" />
  <text x="132" y="517" class="legend-text">GND</text>
  <line x1="175" y1="512" x2="200" y2="512" class="wire-sig1" />
  <text x="207" y="517" class="legend-text">Sygnał</text>
</svg>