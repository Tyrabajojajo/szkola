
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geralt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="character">

        <header class="header">
            <h1 id="name">Geralt</h1>
            <span id="level">Poziom 13</span>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="postac">POSTAĆ</button>
            <button class="tab" data-tab="sklep">SKLEP</button>
            <button class="tab" data-tab="questy">QUESTY</button>
        </nav>

        <section id="postac" class="tab-content">
            <div class="health">
                <div class="health-info">
                    <span>Zdrowie</span>
                    <span id="hp-text">85 / 100</span>
                </div>
                <div class="health-track">
                    <div id="hp-bar" class="health-fill"></div>
                </div>
            </div>

            <div class="stats">
                <div class="stat">
                    <span>Złoto</span>
                    <strong id="gold">100</strong>
                </div>
                <div class="stat">
                    <span>Obrażenia</span>
                    <strong id="damage">15</strong>
                </div>
            </div>

            <div class="weapon">
                <h2>Broń</h2>
                <div id="weapon"></div>
            </div>

            <div class="inventory">
                <h2>Ekwipunek</h2>
                <div id="items" class="items"></div>
                <p id="inventory-message"></p>
            </div>
        </section>

        <section id="sklep" class="tab-content" hidden>
            <h2>Sklep</h2>
            <p>Złoto: <strong id="shop-gold">100</strong></p>
            <div id="shop-items" class="shop-items"></div>
            <p id="shop-message"></p>
        </section>

        <section id="questy" class="tab-content" hidden>
            <h2>Dostępne zadania</h2>
            <div id="available-quests"></div>

            <h2>Przyjęte zadania</h2>
            <div id="accepted-quests"></div>

            <h2>Ukończone zadania</h2>
            <div id="completed-quests"></div>
        </section>

        <section id="battle" hidden>
            <div class="battle-header">
                <h2 id="battle-quest-name">Walka</h2>
            </div>

            <div class="enemy">
                <div id="enemy-icon" class="enemy-icon"></div>
                <h2 id="enemy-name">Przeciwnik</h2>

                <div class="enemy-health-info">
                    <span>HP przeciwnika</span>
                    <span id="enemy-hp-text">100 / 100</span>
                </div>

                <div class="health-track">
                    <div id="enemy-hp-bar" class="enemy-health-fill"></div>
                </div>
            </div>

            <div id="battle-log" class="battle-log">
                Rozpoczyna się walka!
            </div>

            <div id="attack-panel" class="attack-panel" hidden>
                <h3>Wybierz moment ataku!</h3>

                <div id="attack-track" class="attack-track">
                    <div class="attack-center"></div>
                    <div id="attack-marker" class="attack-marker"></div>
                </div>

                <button id="attack-confirm" class="battle-button attack-button">
                    ATAKUJ
                </button>
            </div>

            <div id="item-panel" class="item-panel" hidden>
                <h3>Wybierz przedmiot</h3>
                <div id="battle-items"></div>

                <button id="close-items" class="battle-button secondary-button">
                    POWRÓT
                </button>
            </div>

            <div class="player-battle">
                <div class="battle-player-info">
                    <span>Geralt</span>
                    <span id="battle-player-hp">100 / 100</span>
                </div>

                <div class="health-track">
                    <div id="battle-player-hp-bar" class="health-fill"></div>
                </div>
            </div>

            <div class="battle-actions">
                <button id="fight-button" class="battle-button">FIGHT</button>
                <button id="item-button" class="battle-button">ITEM</button>
                <button id="escape-button" class="battle-button">ESCAPE</button>
            </div>

            <div id="battle-result" class="battle-result" hidden>
                <h2 id="result-title"></h2>
                <p id="result-description"></p>
                <button id="return-button" class="battle-button">
                    POWRÓT
                </button>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
