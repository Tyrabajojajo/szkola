
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geralt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="character">
        <header class="header">
            <div>
                <h1 id="name"></h1>
                <p class="level" id="level"></p>
            </div>
            
        </header>
        <section class="health">
            <div class="health-info">
                <span>ZDROWIE</span>
                <span id="hp-text"></span>
            </div>
            <div class="health-track">
                <div class="health-fill" id="hp-bar"></div>
            </div>
        </section>
        <section class="stats">
            <div class="stat">
                <span class="stat-icon"></span>
                <p>ZŁOTO</p>
                <h2 id="gold"></h2>
            </div>
            <div class="stat">
                <span class="stat-icon"></span>
                <p>OBRAŻENIA</p>
                <h2 id="damage"></h2>
            </div>
        </section>
        <section class="weapon">
            <div class="weapon-icon">⚔️</div>
            <div>
                <p class="subtitle">AKTUALNA BROŃ</p>
                <h2 id="weapon"></h2>
            </div>
        </section>
        <section class="inventory">
            <h2>EKWIPUNEK</h2>
            <div class="items" id="items"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
