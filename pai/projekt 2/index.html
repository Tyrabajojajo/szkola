<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geralt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="character">

        <header class="header">
            <div>
                <h1 id="name"></h1>
                <p class="level" id="level"></p>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="postac">POSTAĆ</button>
            <button class="tab" data-tab="sklep">SKLEP</button>
            <button class="tab" data-tab="questy">QUESTY</button>
        </nav>

        <!-- KARTA POSTACI -->
        <div id="postac" class="tab-content">

            <section class="health">
                <div class="health-info">
                    <span>ZDROWIE</span>
                    <span id="hp-text"></span>
                </div>

                <div class="health-track">
                    <div class="health-fill" id="hp-bar"></div>
                </div>
            </section>

            <section class="stats">
                <div class="stat">
                    <span class="stat-icon">🪙</span>
                    <p>ZŁOTO</p>
                    <h2 id="gold"></h2>
                </div>

                <div class="stat">
                    <span class="stat-icon">⚔️</span>
                    <p>OBRAŻENIA</p>
                    <h2 id="damage"></h2>
                </div>
            </section>

            <section class="weapon">
                <div class="weapon-icon">⚔️</div>
                <div>
                    <p class="subtitle">AKTUALNA BROŃ</p>
                    <h2 id="weapon"></h2>
                </div>
            </section>

            <section class="inventory">
                <h2>EKWIPUNEK</h2>
                <div class="items" id="items"></div>
            </section>

        </div>

        <!-- SKLEP -->
        <div id="sklep" class="tab-content" hidden>

            <section class="shop-header">
                <div>
                    <p class="subtitle">WIEDŹMIŃSKIE TOWARY</p>
                    <h2>Sklep</h2>
                </div>

                <p class="shop-gold">
                    🪙 <span id="shop-gold"></span> złota
                </p>
            </section>

            <p id="shop-message" class="shop-message">
                Wybierz przedmiot, który chcesz kupić.
            </p>

            <section class="shop-items" id="shop-items"></section>

        </div>

        <!-- QUESTY -->
        <div id="questy" class="tab-content" hidden>

            <section class="quest-header">
                <div>
                    <p class="subtitle">WIEDŹMIŃSKIE ZLECENIA</p>
                    <h2>Questy</h2>
                </div>
            </section>

            <section class="quests-section">
                <h2>DOSTĘPNE ZADANIA</h2>
                <div id="available-quests" class="quest-list"></div>
            </section>

            <section class="quests-section">
                <h2>PRZYJĘTE ZADANIA</h2>
                <div id="accepted-quests" class="quest-list"></div>
            </section>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
